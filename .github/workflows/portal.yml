name: Portal checks
on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r backend/requirements.txt pytest httpx
      - run: python -m compileall -q backend/app
      - run: python -m pytest backend/tests
        env:
          PYTHONPATH: backend
      - run: npm ci
        working-directory: fe-api-staging
      - run: node --test "src/**/*.test.js"
        working-directory: fe-api-staging
      - run: npm run build -- --outDir ../deploy/.proxy-web-build
        working-directory: fe-api-staging
      - run: |
          python deploy/build_proxy_bundle.py --output /tmp/n91-portal-proxy-linux.tar.gz
          tar -xzf /tmp/n91-portal-proxy-linux.tar.gz -C /tmp
          cd /tmp/n91-portal-proxy-linux
          sha256sum -c SHA256SUMS
          cd /tmp
          sha256sum n91-portal-proxy-linux.tar.gz > n91-portal-proxy-linux.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: n91-portal-proxy-linux-${{ github.sha }}
          path: |
            /tmp/n91-portal-proxy-linux.tar.gz
            /tmp/n91-portal-proxy-linux.tar.gz.sha256
          if-no-files-found: error
