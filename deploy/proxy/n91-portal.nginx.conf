server {
    listen 127.0.0.1:5188;
    server_name 127.0.0.1;
    root /opt/n91-portal/web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8188;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8188;
    }

    location ^~ /console-ws {
        return 404;
    }
}
